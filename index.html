<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: Configuració crítica per evitar zoom accidental en dispositius mòbils -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DropApp</title>
    
    <!-- Enllaç als estils globals -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    
    <!-- 
      ================================================================
      CAPA 3: SPLASH SCREEN (Pantalla de Càrrega)
      ================================================================
      Justificació UX: Mentre les APIs (Open-Meteo) i el GPS s'inicien, 
      mostrem aquesta pantalla per donar feedback a l'usuari i evitar 
      que vegi una interfície buida o "trencada".
    -->
    <div id="splash-screen">
      <img src="/dropapp_logo.png" alt="Logotip DropApp" id="splash-logo" />
      <p class="splash-text">Carregant dades climàtiques...</p>
    </div>

    <!-- 
      ================================================================
      CAPA PRINCIPAL (Aplicació)
      ================================================================
      Inicialment oculta (display: none) fins que el main.js confirma 
      la càrrega de dades.
    -->
    <div id="app-container" style="display: none">
      
      <!-- CAPA 1: Canvas de p5.js (Fons visual i animació) -->
      <div id="p5-container"></div>
      
      <!-- CAPA 2: Interfície d'Usuari (DOM sobreposat) -->
      <!-- Panell de configuració i botons -->
      <div id="config-backdrop" class="hidden"></div>
      
      <div id="config-panel" class="hidden">
        <h2>Configuració DropApp</h2>

        <!-- Opció: GPS Automàtic -->
        <div class="config-check-group no-border">
          <div class="check-item">
            <span>Ubicació GPS (Automàtic)</span>
            <input type="checkbox" id="chk-gps-auto" />
          </div>
        </div>

        <!-- Opció: Cerca manual -->
        <div class="config-group" id="manual-city-group">
          <label>Cerca ciutat manual</label>
          <input type="text" id="config-city-search" placeholder="Escriu una ciutat..." />
          <ul id="city-results" class="hidden"></ul>
        </div>

        <!-- Interval de temps -->
        <div class="config-group">
          <label>Hores entre dosis (0 = Test 1 min)</label>
          <input type="number" id="config-interval-hours" min="0" max="24" value="1" />
        </div>

        <!-- Tema Visual -->
        <div class="config-group">
          <label>Tema de l'App</label>
          <select id="config-dark-mode">
            <option value="on">Mode Nit (Fosc)</option>
            <option value="off">Mode Dia (Clar)</option>
          </select>
        </div>

        <!-- Control de Hardware -->
        <div class="config-check-group">
          <div class="check-item"><span>Notificacions</span><input type="checkbox" id="chk-notificacio" checked /></div>
          <div class="check-item"><span>Llanterna</span><input type="checkbox" id="chk-flash" /></div>
        </div>

        <div class="config-actions">
          <button id="config-cancel" class="btn-cancel">Cancel·lar</button>
          <button id="config-save" class="btn-save">Desar canvis</button>
        </div>
      </div>

      <!-- Botó flotant d'accés a la configuració -->
      <button id="config-toggle" aria-label="Obrir Configuració">⚙️</button>
    </div>

    <!-- Càrrega de Scripts: Llibreria p5.js i Lògica Principal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
